# On-site settings (README section 3). Use with: python -m reachglass tello --config site.yaml
# Anything left commented keeps the default from reachglass/config.py.

drone: {video_lag_s: 0.25}              # step 1: latency test 2026-09-26

camera: {fx: 1077, fy: 1077}            # step 2: median fx/fy from calibrate_camera (1.5 / 2 / 3 m)


perception:
  pitch_sign: 1                       # step 1: only if forward acceleration gives NEGATIVE pitch

  # --- the bottle: found by YOLO-World by default ("blue water bottle" / "hydro flask water bottle", 960 px,
  # every 3rd frame while searching, plus a blue check on each box so another bottle is not taken for it).
  # Nothing to set here: the preset lives in reachglass/config.py (TARGET_PRESETS["yolo-world"]).
  # Check it live on the Tello:  python -m reachglass.tools.target_view tello --config site.yaml
  #
  # Back to the colour dummy for one run:  python -m reachglass tello --config site.yaml --target color
  # Or for good, uncomment (the colour blob sees only the blue body, 0.19 m, not the cap):
  # target_detector:
  #   kind: color_blob
  #   params: {label: bottle, hsv_ranges: [[100, 100, 70, 122, 255, 255]]}   # found the bottle live on the Tello feed
  # object_heights_m: {bottle: 0.19}
  # object_widths_m: {bottle: 0.09}
  # tracking: {confirm_conf: 0.55}      (top level, not under perception)

  person_height_m: 1.70              # step 4: wearer's real height WITH SHOES, to +-2 cm
  person_height_sd_m: 0.02

follow: {altitude_m: 1.9, distance_m: 1.0}    # defaults; altitude_m >= wearer height + 0.2
safety: {max_altitude_m: 2.3}                 # keep below your ceiling
