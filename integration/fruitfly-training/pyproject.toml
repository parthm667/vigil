[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flyfollow"
version = "0.1.0"
description = "Fly-connectome pursuit controller for a Tello: CMA-ES training of the adapter around a fixed MaleCNS subgraph (see docs/DRONE_RL_PLAN.md)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "flydrones",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "pyarrow>=15",
  "pyyaml>=6.0",
  "cma>=3.3",
  "matplotlib>=3.8",
  "modal>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# live fly body + brain visualization on the demo laptop (never needed on Modal)
viz = ["mujoco>=3.2", "rerun-sdk>=0.30", "imageio>=2.34", "imageio-ffmpeg>=0.5", "pyzmq>=26"]
# drone runtime on the demo laptop (Tello I/O, video decode, operator console)
drone = ["djitellopy>=2.5", "av>=12", "opencv-python>=4.9", "pyzmq>=26", "imageio>=2.34", "imageio-ffmpeg>=0.5"]
# fallback detector when the perception owner's YOLO is not running (pulls torch)
perception = ["ultralytics>=8.3"]

[tool.uv.sources]
flydrones = { path = "third_party/FlyDrones", editable = true }

[tool.setuptools.packages.find]
include = ["flyfollow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["third_party"]
