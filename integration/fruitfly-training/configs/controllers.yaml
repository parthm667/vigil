# Pursuit controller adapter: parameter bounds, hand-set defaults, fixed encoder/decoder
# constants and the hand-calibration stimuli (docs/DRONE_RL_PLAN.md 4.1, 4.6, 4.9).
#
# Every trained parameter is listed as [lo, hi, scale, default]. CMA-ES works in x in [0, 1]^n:
# linear:  v = lo + x (hi - lo);  log: v = lo * (hi / lo) ** x.  Changing a bound changes what an
# existing x means, so never edit bounds between runs of one arm.

encoder:
  # 25 trained parameters (plan 4.1).
  params:
    enc_r_max_hz:       [20.0, 400.0, log, 160.0]  # peak Poisson rate into one LC10a bin (core1 scan: 120 to 200 best per tick)
    enc_width_deg:      [3.0, 40.0, log, 8.0]      # Gaussian tuning sigma at s = 1 (bin spacing is about 5.75 deg)
    enc_overlap_deg:    [0.0, 20.0, lin, 6.0]      # each side's bins extend this far past the midline
    enc_size_width_exp: [0.0, 2.0, lin, 1.0]       # sigma_eff = sigma * s ** a (spot widens when closer)
    enc_size_amp_exp:   [-1.0, 2.0, lin, 0.5]      # amplitude * s ** b
    enc_vel_gain:       [0.0, 3.0, lin, 0.5]       # rate * (1 + k_v |dtheta|), dtheta in rad/s
    enc_bin_gain:       [0.5, 2.0, log, 1.0]       # 16 per-bin multipliers enc_bin_gain_{L,R}{0..7}
    enc_arousal:        [0.5, 2.0, log, 1.0]       # arousal_mode gain: LC10a gain; rate: P1 = enc_arousal * arousal_base_hz
    enc_lc9_hz:         [0.1, 10.0, log, 2.0]      # LC9 side rate = hz * side spot activity * s^b * vel, capped at lc_cap_hz
    enc_lc11_hz:        [0.1, 10.0, log, 2.0]      # audit: 50 Hz LC9/LC11 swamps LC10a, so keep these low
  theta_max_deg: 40.0      # outermost bin edge on each side (camera HFOV is 54 to 72 deg)
  s_clip: [0.2, 5.0]       # normalized size range used by the size curves
  dtheta_clip: 3.0         # rad/s
  rate_cap_hz: 400.0       # LIF refractory period is 2.2 ms, so more is pointless
  lc_cap_hz: 10.0          # hard cap on LC9 and LC11 rates
  # Audit (docs/audit_result.md): P1/AROUSAL has no pathway onto LC10a or AOTU019, so the plan's
  # fallback is used: enc_arousal is a gain on LC10a input and P1 gets a fixed tonic rate.
  arousal_mode: gain       # gain | rate | auto (rate when the brain has AROUSAL neurons)
  p1_tonic_hz: 0.0         # fixed P1 rate in gain mode (not trained)
  p1_cap_hz: 10.0          # P1 never exceeds this in either mode
  arousal_base_hz: 2.5     # rate mode: P1 = enc_arousal * this

decoder:
  # 22 trained parameters (plan 4.1). Weights act on rates normalized by the calibration mean
  # rate of each DN (or NOBRAIN pooled feature), so a typical normalized rate is about 1.
  params:
    dec_w_yaw:      [-15.0, 15.0, lin, 0.0]  # 5 weights dec_w_yaw_{type} on (rate_R - rate_L)
    dec_u_fwd:      [-15.0, 15.0, lin, 0.0]  # 10 weights dec_u_fwd_{type}_{L,R}
    dec_b_yaw:      [-5.0, 5.0, lin, 0.0]    # must cancel core1's right bias (DNa02 R-L > 0 at 0 deg)
    dec_b_fwd:      [-8.0, 8.0, lin, 0.0]    # rates are not centered, so b_fwd offsets sum_t u_t n_t (about 3 to 5)
    dec_g_yaw:      [0.0, 1.0, lin, 0.8]     # init below 1 so CMA does not start on a bound
    dec_g_fwd:      [0.0, 1.0, lin, 0.8]
    dec_tau_yaw_ms: [10.0, 150.0, log, 80.0] # low-pass on rates, bounded at 150 ms (plan 4.1)
    dec_tau_fwd_ms: [10.0, 150.0, log, 100.0]
    dec_deadzone:   [0.0, 10.0, lin, 0.5]    # stick units, soft shrink on both outputs
  norm_floor_hz: 2.0       # silent channels are normalized by this instead of ~0
  norm_default_hz: 20.0    # used only when no calibration file is given (tests)

pid:
  # 4 parameters (plan 4.9). Defaults are the PID-HAND values.
  params:
    Kp_y: [20.0, 400.0, log, 100.0]  # stick per unit of (cx - cx_ref) / W
    Kd_y: [1.0, 100.0, log, 20.0]    # stick per unit/s
    Kp_f: [5.0, 150.0, log, 40.0]    # stick per m of range error
    d0:   [0.0, 0.5, lin, 0.15]      # m, forward deadband

nobrain:
  n_pools: 5               # per-side azimuth pools (triangular weights over the 8 bins)

calibration:
  bearings_deg: [-30.0, -18.0, -10.0, -4.0, 0.0, 4.0, 10.0, 18.0, 30.0]  # denser near 0, where pursuit spends its time
  sizes: [0.6, 1.0, 1.5]   # centered on the standoff: DN activity saturates in s, so wide sizes bias the zero crossing
  warmup_ms: 1000.0
  settle_ms: 200.0
  measure_ms: 1000.0
  repeats: 3
  ridge: 1.0               # on standardized features, intercept not penalized
  yaw_z_per_deg: 0.04      # desired tanh argument for yaw: 1.2 at 30 deg (about 50 stick at G = 0.8)
  fwd_z_per_unit: 2.0      # desired tanh argument for forward: 2 (1 - s); 1.0 left NOBRAIN and FLY-HAND hanging back
  default_brain: pursuit_core1.npz
  # --all calibrates these (audit: core2 runs away, never use it for FLY arms)
  brains: [pursuit_core1.npz, pursuit_core1_shuf1.npz, pursuit_core1_shuf2.npz, pursuit_core1_shuf3.npz]
