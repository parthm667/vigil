# CMA-ES training, Modal resources and cost constants (docs/DRONE_RL_PLAN.md 4.4 to 4.7).
# Read by flyfollow.rl.cma_train, flyfollow.rl.modal_app and flyfollow.rl.eval.
# Freeze everything above "modal:" before launch and never change it between arms.

tag: v1                       # run directory: data_root()/runs/<arm>_s<seed>_<tag>/

# Env config overrides applied to every episode a run evaluates (candidates, PID-HAND denominators,
# selection), deep-merged into configs/env.yaml. Empty for the main runs. A fine-tune sets it per run,
# for example the smoothness fine-tune: {reward: {w_j: 26.4}} (4 x the frozen 6.6), via
# `cma_train --env-override reward.w_j=26.4` or `launch --env-override reward.w_j=26.4`.
env_overrides: {}

cma:
  sigma0: 0.05                # on the normalized [0, 1] parameter vector. The plan's 0.2 made almost every
                              # candidate far worse than the init (measured: local NOBRAIN runs never beat it)
  stds_by_prefix:             # per-coordinate multipliers of sigma0 (pycma CMA_stds); readout params act on
    dec_w_: 0.08              # tanh arguments with bounds ~10x wider than their useful scale: a normalized
    dec_u_: 0.08              # step of 0.003 on them costs ~1.1x, 0.05 costs ~6x (NOBRAIN, 2026-09-26)
    dec_b_: 0.2
  maxstd: 0.3                 # cap any coordinate's std (PID-CMA's sigma ran away to 11.7 on the [0, 1] box)
  popsize: 32                 # default for n = 47 is 15; doubled because fitness is noisy
  generations: 150
  bounds: [0.0, 1.0]

episodes:
  k_follow: 20                # K = 32 per candidate (plan: 5 + 3). Measured split-half rank reliability of
  k_approach: 12              # candidate scores: 0.80 at K = 8 vs 0.91 at K = 32 (NOBRAIN), 0.55 vs 0.75 (PID)
  profile: train
  warmup_s: 1.0               # brain warm start, excluded from reward
  episode_s: null             # null = lengths from configs/env.yaml; set only for smoke tests

fitness:
  pid_arm: PID-HAND           # denominator arm: each return is divided by |PID-HAND return on the same seed|
  denom_floor: 20.0          # lead decision: the plan's floor of 1 let near-zero PID-HAND approach returns (median -31, max +13.8) dominate a generation
  clip: [-4.0, 2.0]          # lead decision: per-episode clip so one crash does not decide a candidate's rank
  w_follow: 0.5
  w_approach: 0.5
  error_score: -20.0          # normalized score of an episode that raised (PID-HAND itself scores about -1)

selection:                    # distribution mean on SELECTION_SEEDS; best mean ever seen = best checkpoint
  every: 10
  at_start: true              # also score the initialization (gen 0), so best is never worse than init
  at_end: true
  n_follow: 40                # SELECTION_SEEDS[:40] follow, [40:64] approach
  n_approach: 24

brain:
  core: 1                     # pursuit core trained on (1 or 2), decided after the audit
  file: "pursuit_core{core}.npz"
  shuffle_file: "pursuit_core{core}_shuf{seed}.npz"   # FLY-SHUF / FLY-SHUF-YAW run seed i uses shuffle i

runs:                         # launch order: seed 1 of every arm first, then seeds 2 and 3
  # Lead decision 2026-09-26: yaw-only fly (plan 4.3 fallback): the fly steers, the PID sets forward.
  # The full arms (FLY-CMA, FLY-SHUF, NOBRAIN) stay available: `launch --arms FLY-CMA --seeds 1`.
  arms: [FLY-YAW, FLY-SHUF-YAW, NOBRAIN-YAW, PID-CMA]
  seeds: [1, 2, 3]
  gens_later_seeds: null      # e.g. 100 if the smoke test projects that 150 does not fit

local:
  processes: 10               # local backend pool size (this laptop: Apple M5, 10 cores)
  start_method: null          # null = spawn on macOS, forkserver on Linux

chunking:
  items_per_chunk: 16         # episodes per evaluate_chunk call (2 candidates x K)
  by_arm:                     # no-brain episodes take about 20 ms, so bigger chunks save Modal round trips
    NOBRAIN: 96
    NOBRAIN-YAW: 96
    PID-CMA: 96

eval:                         # final evaluation (plan 4.7) on TEST_SEEDS
  n_follow: 125               # TEST_SEEDS[:125] follow, [125:200] approach
  n_approach: 75
  sets:
    test: train               # set name: env profile
    demo: demo
    stress: stress
  lesion_n: 40                # lesion test (FLY-YAW, and FLY-CMA if trained) on the first N test seeds
  lesion_arms: [FLY-YAW, FLY-CMA]
  references: [FLY-YAW-HAND, FLY-HAND, PID-HAND]   # untrained arms evaluated from their hand calibration

modal:
  app_name: flyfollow
  volume: flyfollow-data
  # Starter plan: 100 concurrent containers per workspace. Budget:
  #   eval.max_containers (80) + 12 train drivers + 1 orchestrator = 93.
  # Raise eval.max_containers on the Team plan (5,000), or live with
  # modal.Function.update_autoscaler(max_containers=...).
  eval:
    cpu: 8.0                  # physical cores (1 core = 2 vCPU)
    workers_per_container: 16 # one single-threaded episode process per hyperthread
    memory_mib_per_worker: 1024
    max_containers: 80
    scaledown_window_s: 60    # keep warm containers between generations
    timeout_s: 1800           # one chunk: longest follow episode x ceil(items / workers), with margin
    retries: 2
    start_method: forkserver
  train:
    cpu: 0.5
    memory_mib: 1024
    timeout_s: 86400          # 24 h, the Modal maximum; preemption and retries resume from the pickle
    retries: 3
  orchestrator:
    cpu: 0.125                # Modal minimum
    memory_mib: 512
    timeout_s: 86400
    max_restarts_per_run: 3   # re-spawn a train call that died (it resumes from its pickle)
  commit_every: 1             # volume.commit() every N generations

prices:                       # modal.com/pricing and `modal billing rates`, verified by the lead 2026-09-26
  cpu_core_hour_usd: 0.0473   # $0.0000131 per physical core per second
  mem_gib_hour_usd: 0.008     # $0.00000222 per GiB per second; billed max(request, usage)
  billing_overhead_factor: 1.2  # startup and scaledown idle that in-container timers do not see

budget:
  total_usd: 800              # hard budget preference is under $1,000 for everything
  per_run_usd: null           # set to override the share rule below for every run
  share:                      # fraction of total_usd per arm, split evenly over that arm's seeds in runs.seeds
    FLY-YAW: 0.4              # (an arm not in runs.arms gets its whole share as one run)
    FLY-SHUF-YAW: 0.3
    NOBRAIN-YAW: 0.1
    PID-CMA: 0.1
    FLY-CMA: 0.1              # reserve for an optional full-fly run

projection:                   # used by `launch` when no smoke measurement exists for an arm
  packing_efficiency: 0.8     # busy fraction of a chunk's workers (follow and approach lengths differ)
  gen_overhead_s: 3.0         # per generation: map submission and results, driver, volume commit (guess)
  # Mean wall seconds per episode (5 follow of 60 s, 3 approach of up to 25 s) on one Modal
  # hyperthread under load. From the 2026-09-26 probe: FLY-HAND on pursuit_core1 ran 10 s of sim in
  # 1.35 s on an idle Modal container (0.135 s per sim second; about 3.4x the M5), times 1.4 for
  # hyperthread sharing at 16 workers per 8 cores. NOBRAIN and PID-HAND took 7 to 17 ms per episode.
  episode_wall_s:
    FLY-YAW: 5.5              # same brain as FLY-CMA; forward comes from the PID (negligible cost)
    FLY-SHUF-YAW: 5.5
    NOBRAIN-YAW: 0.1
    FLY-CMA: 5.5              # measured: 91 container-s x 16 workers / 264 episodes (smoke, 2026-09-26)
    FLY-SHUF: 5.5             # assumed equal to FLY-CMA (same neuron count; shuffles fire similarly)
    NOBRAIN: 0.1
    PID-CMA: 0.05
  same_cost_as:               # an arm without its own smoke test uses this arm's smoke measurement
    FLY-YAW: FLY-CMA
    FLY-SHUF-YAW: FLY-CMA
    FLY-YAW-HAND: FLY-CMA
    FLY-SHUF: FLY-CMA
    FLY-HAND: FLY-CMA
    NOBRAIN-YAW: NOBRAIN

chart:                        # metric keys in EpisodeResult.metrics (flyfollow.rl.env.PursuitEnv.metrics)
  arms: [FLY-YAW, FLY-SHUF-YAW, NOBRAIN-YAW, PID-CMA]   # columns (trained: mean and range over seeds)
  references: [FLY-YAW-HAND, PID-HAND]                  # untrained references, drawn as labeled lines
  follow_in_band: frac_in_band
  approach_success: success
  loss_per_min: loss_events_per_min
  min_distance: min_dist
  bearing_rms: rms_bearing_err_deg
