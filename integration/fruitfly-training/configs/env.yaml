# PursuitEnv: episodes, domain randomization, reward, governor and box filter
# (docs/DRONE_RL_PLAN.md 4.1, 4.4, 4.5). Stick values are final sent Tello units (-100..100).
#
# Randomized entries: [lo, hi] is uniform, a scalar is fixed, {choice: [a, b]} picks one value.
# Every episode draws one uniform per randomized key in a fixed order (flyfollow.rl.env.PARAM_KEYS),
# so changing a range never shifts the other draws of a seed.

episode:
  follow_s: 60.0
  approach_s: 25.0
  preroll_s: 1.0          # detector and filter run this long on the static start scene before t = 0
  success_hold_s: 2.0     # approach success: in band (and target in view) this long
  follow_start_alt_offset_m: [-0.15, 0.25]  # drone altitude = head height + this at t = 0
  approach_start_alt_m: 1.0                 # FIND search altitude (plan 5.2)

reward:
  # FROZEN (plan item 5), re-frozen 2026-09-26 after the lag-test dynamics. Never change between arms.
  # Plan start weights: w_r 1.0, w_x 2.0, w_j 5.0, w_g 1.0. Share = term / sum of all negative terms and
  # events EXCEPT ev_collision and ev_tail: collision tails are rare, charged at a rate that itself grows with
  # w_r, w_x and w_g, and would otherwise dominate the rescale (2 early collisions in 50 episodes = 31 %).
  # PID-HAND, 50 train episodes (seeds 10000-10049, k % 8 < 5 follow, else approach):
  #  v1, old dynamics, w 2.6/5.3/6.6/4.3: e_z 21.9 %, e_x 11.9 %, jerk 22.0 %, safety 12.1 %.
  #  v2, lag-test dynamics, same weights: e_z 34.9 %, e_x 8.9 %, jerk 15.4 %, safety 11.6 % (e_x out of range).
  #  v2 weights below: e_z 27.7 %, e_x 13.1 %, jerk 15.9 %, safety 13.1 % (lost 4.9 %, too_close 7.1 %,
  #  ev_loss 13.8 %, ev_too_close 4.5 %); disjoint seeds 10500-10549: 33.8/12.6/15.3/10.9 %. Counting
  #  collisions too, e_x and safety are 8.4 % and 8.3 %. With max_back_stick 40 there are no collisions and
  #  the shares are 27.8/11.8/17.1/12.4 % either way. Max non-jerk rate is now 33.3 per second.
  w_r: 2.0
  w_x: 7.6
  w_j: 6.6
  w_g: 4.7
  w_l: 5.0
  w_c: 10.0
  ev_loss: -10.0
  ev_too_close: -20.0
  ev_collision: -200.0
  ev_success: 20.0
  band_frac: 0.15         # b = 0.15 * Z_ref everywhere (reward, metrics, R3/R4)
  e_z_cap: 3.0
  far_quad_m: 1.0         # far-side quadratic max(0, d - b)^2 / (1 m)
  lost_after_s: 1.0       # l_t = 1 while no true detection arrived for longer than this
  collide_person_m: 0.5   # horizontal range to the person
  collide_object_m: 0.2   # 3D distance to the object center
  # Approach band center. nominal (plan 4.5): Z_ref. achievable: Z_ref * true size / class prior, where any
  # size-based controller settles. With the prior error of +-25 % and a +-15 % band, only about 57 % of approach
  # episodes can end inside the nominal band (success is still possible by passing slowly through it).
  approach_ref: achievable   # lead decision: the prior error is unobservable to the controller; plan 4.2 already accepts a 0.75 to 1.25 m end point

governor:
  ud_gain: 60.0           # ud = clip(60 * (cy_ref - cy) / H, -30, 30)
  ud_max: 30.0
  lost_yaw_stick: 20.0
  lost_hover_s: 5.0
  lost_land_s: 10.0
  land_kinds: [follow]    # FIND/APPROACH have no person-lost landing rule (plan 2.1)
  brain_timeout_s: 0.5
  backoff_stick: 40.0     # reverse stick while the estimated range is below z_min (capped by the episode's max_back_stick)
  slew_yaw_per_s: 400.0   # 20 per tick
  slew_fb_per_s: 200.0    # 10 per tick
  slew_ud_per_s: 200.0
  alt_floor_follow_m: 0.5
  alt_floor_approach_m: 0.8
  alt_ceiling_m: 2.4
  min_battery_pct: 25.0

filter:
  hold_s: 0.5
  q_c: 100000.0           # px^2/s^3 white-acceleration density on cx, cy (swept 2.5e4 to 1.6e6 with PID-HAND)
  q_h_rel: 0.1            # 1/s^3, scaled by h^2
  r_c_px: 3.0
  r_h_frac: 0.07
  gate_sigma: 5.0         # reject a box whose innovation exceeds this many sigma (false boxes)
  gate_reinit: 3          # after this many rejections in a row, restart on the new box

approach:
  alt_floor_m: 0.8        # Z_ref = clip(2.5 * (max(alt_floor, object center) - object base), 1.0, 2.0)
  z_ref_factor: 3.0       # lead decision: 2.5 put floor objects exactly at the VFOV edge (68 % in view at demo); 3.0 adds margin
  z_ref_min_m: 1.0
  z_ref_max_m: 2.4       # raised with z_ref_factor so a floor object at 0.8 m altitude is not capped back onto the edge

profiles:
  train:
    # Drone response, centered on the Tello lag test (2026-09-26, origin/rl-pipeline
    # data/lag_test/fit_20260926_052637.json; medians of 6 steps per axis, all at stick 30, from the
    # 10 Hz state log): yaw 55 deg/s per 100, dead 0.18 s, tau 0.02 s; forward 0.96 m/s per 100,
    # dead 0.47 s, tau 0.45 s; lateral about the same; vertical 0.32 m/s per 100, dead 0.41 s, tau 0.02 s.
    # About +-30 % (plan Section 0). Forward gain is asymmetric upward because only stick 30 was measured
    # and the Tello stick map may be nonlinear. Lateral uses the forward gain, tau and dead time.
    fwd_gain_mps: [0.67, 1.5]     # m/s at sent stick 100
    yaw_gain_dps: [39.0, 72.0]
    vz_gain_mps: [0.23, 0.42]
    tau_fwd_s: [0.31, 0.59]
    tau_yaw_s: [0.02, 0.10]
    tau_z_s: [0.02, 0.10]         # vertical tau measured 0.02 s; same range as yaw
    fwd_dead_s: [0.33, 0.61]      # command dead time per axis (was one shared 20 to 120 ms latency)
    yaw_dead_s: [0.13, 0.24]
    vz_dead_s: [0.29, 0.53]
    drift_sigma_mps: [0.0, 0.05]  # stationary std of an OU drift velocity (tau 2 s) per axis
    pitch_scale: [0.5, 1.0]       # pitch = scale * atan(a_fwd / g), capped at 25 deg
    # Governor settings
    # max_fwd_stick: LEAD DECISION (2026-09-26) based on the measured ~1 m/s per 100 forward gain: the plan's
    # 20 to 50 would cap the drone at 0.2 to 0.5 m/s, slower than a person walks. Re-check at R2 props-off / R3.
    max_fwd_stick: [40.0, 80.0]
    # max_back_stick: LEAD DECISION (2026-09-26). The plan's 20 is only 0.19 m/s at the measured gain, so a person
    # walking back toward the drone runs into it (demo collisions 5 -> 0 at 40). Randomized 20 to 40 so the
    # controller works under either cap; the demo uses 40. No rear sensing: confirm at R2 props-off / R3 with a spotter.
    max_back_stick: [20.0, 40.0]
    z_ref_follow_m: [1.5, 2.5]
    side_offset_deg: [-10.0, 10.0]
    z_min_person_m: [1.0, 1.3]
    z_min_object_m: 0.5
    # Person
    walk_speed_frac: [0.0, 1.0]   # per straight segment, times the cap min(1.4, 0.9 * v_max)
    head_height_m: [1.5, 1.9]
    head_size_m: [0.20, 0.26]
    # Camera and detector
    fx_px: [650.0, 950.0]
    fy_over_fx: [0.99, 1.01]
    fx_calib_err: [0.97, 1.03]    # Settings.fx = true fx * this (checkerboard calibration error)
    video_latency_s: [0.15, 0.45] # capture to decoded frame (lag test video onset: about 0.2 to 0.3 s)
    det_time_s: [0.03, 0.08]      # detector time, added on top (known exactly at runtime via t - t_decoded)
    latency_est_err: [0.8, 1.2]   # Settings.video_latency_s = true video latency * this
    det_rate_hz: [8.0, 30.0]
    box_center_sigma_px: [1.0, 5.0]
    box_h_noise_frac: [0.03, 0.10]
    dropout_iid: [0.0, 0.15]
    burst_rate_hz: [0.0, 0.2]
    false_box_frac: [0.0, 0.02]
    # Episode starts
    follow_start_margin_m: 0.3    # start range Z_min + 0.3 m to 4 m
    follow_start_range_max_m: 4.0
    follow_start_bearing_deg: 25.0
    object_bearing_deg: 20.0

  demo:
    # The lag-test medians (update after R0 FOV calibration): fx 921, yaw 55 deg/s, forward 0.96 m/s,
    # video latency 0.25 s; governor at the demo settings message (plan 6) with max_fwd_stick 60.
    fwd_gain_mps: 0.96
    yaw_gain_dps: 55.0
    vz_gain_mps: 0.32
    tau_fwd_s: 0.45
    tau_yaw_s: 0.02
    tau_z_s: 0.02
    fwd_dead_s: 0.47
    yaw_dead_s: 0.18
    vz_dead_s: 0.41
    fx_px: 921.0
    video_latency_s: 0.25
    max_fwd_stick: 60.0           # walker cap min(1.4, 0.9 * 0.96 * 0.6) = 0.52 m/s
    max_back_stick: 40.0          # lead decision above; 0.38 m/s at the measured gain
    z_ref_follow_m: 2.0
    side_offset_deg: 8.0
    z_min_person_m: 1.2

  stress:
    # Train dynamics plus: capture-to-box latency about 0.8 s, dropout 30 %, focal length at the range edges.
    video_latency_s: 0.75         # + detector time 0.03 to 0.08 s
    dropout_iid: 0.30
    fx_px: {choice: [650.0, 950.0]}

  obstacles:
    # Follow with static obstacles around the user's path (off in every other profile). Same random
    # world as train for the same seed (world_profile), plus footprints from their own stream.
    obstacles: true
    world_profile: train

walker:
  straight_s: [2.0, 8.0]
  stop_s: [1.0, 6.0]
  turn_deg: [30.0, 180.0]
  turn_rate_dps: [30.0, 90.0]
  p_straight: 0.5
  p_turn: 0.3                     # p_stop = 1 - p_straight - p_turn
  p_new_speed: 0.6                # straight segment changes speed with this probability
  accel_mps2: 1.0
  speed_cap_mps: 1.4
  speed_frac_of_vmax: 0.9
  step_prob: 0.5                  # "0 to 1 step toward the drone per episode"
  step_dist_m: [0.4, 1.0]
  step_speed_mps: [0.4, 0.8]
  step_stop_dist_m: 0.8           # the person does not walk into the drone
  start_heading_jitter_deg: 45.0  # initial heading = away from the drone +- this

objects:
  size_m: [0.08, 0.30]
  prior_ratio: [0.75, 1.25]       # true size / class prior
  base_h_m: [0.0, 1.0]
  floor_prob: 0.35                # "at least 30 % on the floor"
  start_margin_m: 0.5             # start range Z_ref + 0.5 m to 6 m
  start_range_max_m: 6.0

camera:
  h_full_det_px: 20.0             # p_det = (h / 20)^2 below 20 px
  burst_len_s: [0.2, 1.5]
  false_h_px: [15.0, 150.0]

obstacles:
  # Obstacle scenarios for checking the runtime avoidance stack against the trained steering
  # (scripts/eval_obstacles.py). Only used when enabled here or by the "obstacles" profile; training
  # profiles never read it.
  enabled: false
  avoid: true                     # avoidance layer on (set false to see the controller alone)
  occlusion: true                 # footprints above the camera-to-head line of sight hide the user's box
  n_on_path: [1, 2]               # on the user's path; the user detours around them
  n_near_path: [2, 4]             # beside the path, footprint edge near_gap_m from it
  near_gap_m: [0.3, 1.2]
  on_path_tall_prob: 0.7          # on-path obstacles drawn from tall types this often
  window_s: [4.0, 54.0]           # where along the walk they are placed
  detour_run_m: 1.2               # detour starts and ends this far before and after the footprint
  person_clear_m: 0.3             # the user's path keeps this clearance from every footprint
  start_clear_m: 1.0              # from the drone and user start positions
  types:                          # p = relative weight, sx/sy = footprint (m), h = height (m)
    chair:   {p: 0.15, sx: [0.40, 0.55], sy: [0.40, 0.55], h: [0.80, 1.05]}
    table:   {p: 0.15, sx: [0.70, 1.60], sy: [0.60, 1.00], h: [0.70, 0.80]}
    box:     {p: 0.15, sx: [0.30, 0.70], sy: [0.30, 0.70], h: [0.30, 1.20]}
    shelf:   {p: 0.20, sx: [0.60, 1.20], sy: [0.30, 0.45], h: [1.60, 2.20], tall: true}
    cabinet: {p: 0.10, sx: [0.50, 1.00], sy: [0.40, 0.60], h: [1.70, 2.10], tall: true}
    plant:   {p: 0.15, sx: [0.40, 0.70], sy: [0.40, 0.70], h: [1.20, 2.00], tall: true}
    lamp:    {p: 0.10, sx: [0.30, 0.45], sy: [0.30, 0.45], h: [1.50, 1.90], tall: true}
  # Collision and relevance: the drone (radius 0.12 m) hits a footprint below its top + 0.05 m; a footprint
  # counts for the corridor and min_obstacle_dist when its top is above the drone altitude - vertical_margin_m.
  drone_radius_m: 0.12
  vertical_margin_m: 0.3
  # Avoidance layer (mirrors the teammate's runtime stack; yaw is never touched)
  corridor_len_m: 1.0             # look-ahead from the drone center
  corridor_half_width_m: 0.25     # Tello half width about 0.1 m + 0.15 m margin
  sidestep_after_s: 1.5           # braking this long starts a sidestep
  sidestep_m: 0.5
  sidestep_stick: 40.0            # lr stick during the sidestep (ends at 0.5 m integrated or timeout)
  sidestep_timeout_s: 3.0
  sidestep_cooldown_s: 1.0
